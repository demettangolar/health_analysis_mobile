name: health_monitor
description: A Flutter app that records IMU sensor data and microphone audio for health analysis.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # IMU sensors (accelerometer + gyroscope)
  sensors_plus: ^4.0.2

  # Microphone recording (bonus)
  record: ^6.0.0

  # Runtime permissions
  permission_handler: ^11.3.1

  # Access to device file system
  path_provider: ^2.1.3

  # Share/export data files
  share_plus: ^9.0.0

  # Date/time formatting
  intl: ^0.19.0

  # Wakelock so screen stays on during recording
  wakelock_plus: ^1.2.8

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
